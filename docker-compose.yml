version: '3.8'
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: fallguard_mqtt
    ports:
      - "1883:1883"
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: fallguard_db
    environment:
      POSTGRES_USER: fallguard
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: fallguard_db
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped